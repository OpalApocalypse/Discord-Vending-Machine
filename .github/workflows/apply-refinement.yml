name: Apply vending machine refinement

on:
  push:
    branches:
      - codex/modern-jda-vending-machine
    paths:
      - .github/workflows/apply-refinement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/modern-jda-vending-machine

      - name: Apply refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          java_path = Path("src/main/java/org/oaple/vendingmachine/VendingMachineBot.java")
          java = java_path.read_text()

          replacements = [
              (
                  "import net.dv8tion.jda.api.entities.Member;\nimport net.dv8tion.jda.api.entities.MessageEmbed;",
                  "import net.dv8tion.jda.api.entities.Member;\nimport net.dv8tion.jda.api.entities.Message;\nimport net.dv8tion.jda.api.entities.MessageEmbed;",
              ),
              (
                  "import java.util.concurrent.TimeUnit;\nimport java.util.regex.Pattern;",
                  "import java.util.concurrent.TimeUnit;\nimport java.util.function.Consumer;\nimport java.util.regex.Pattern;",
              ),
              (
                  """            dispatchDispense(resolveOutputChannel(event.getGuild(), event.getMessageChannel()), dispensed);""",
                  """            dispatchDispense(
                    resolveOutputChannel(event.getGuild(), event.getMessageChannel()),
                    dispensed,
                    delivered -> updateMachineDropBox(event.getMessage(), dispensed, delivered)
            );""",
              ),
              (
                  """        String raw = event.getMessage().getContentRaw().trim();
        if (!looksLikeCode(raw)) {
            return;
        }

        try {
            DispensedItem dispensed = dispense(raw);
            dispatchDispense(resolveOutputChannel(event.getGuild(), event.getChannel()), dispensed);""",
                  """        String code = readCode(event.getMessage().getContentRaw());
        if (!looksLikeCode(code)) {
            return;
        }

        try {
            event.getMessage().delete().queue(null, ignored -> {
            });
            DispensedItem dispensed = dispense(code);
            dispatchDispense(resolveOutputChannel(event.getGuild(), event.getChannel()), dispensed, ignored -> {
            });""",
              ),
              (
                  """            dispatchDispense(resolveOutputChannel(event.getGuild(), event.getMessageChannel()), dispensed);""",
                  """            dispatchDispense(resolveOutputChannel(event.getGuild(), event.getMessageChannel()), dispensed, ignored -> {
            });""",
              ),
              (
                  """    private void dispatchDispense(MessageChannel channel, DispensedItem dispensed) {
        long delay = 0;
        for (String step : machine().getDispenseSequence()) {
            channel.sendMessage(step.replace("{code}", dispensed.slot().getCode()))
                    .queueAfter(delay, TimeUnit.MILLISECONDS);
            delay += 700;
        }
        channel.sendMessageEmbeds(dispenseEmbed(dispensed))
                .queueAfter(delay, TimeUnit.MILLISECONDS);
    }

    private boolean looksLikeCode(String raw) {
        return SLOT_CODE.matcher(normalizeCode(raw)).matches();
    }

    private String normalizeCode(String raw) {
        return raw == null ? "" : raw.trim().toUpperCase(Locale.ROOT);
    }""",
                  """    private void dispatchDispense(MessageChannel channel, DispensedItem dispensed, Consumer<Message> onDelivered) {
        long delay = 0;
        for (String step : machine().getDispenseSequence()) {
            channel.sendMessage(step.replace("{code}", dispensed.slot().getCode()))
                    .queueAfter(delay, TimeUnit.MILLISECONDS);
            delay += 700;
        }
        channel.sendMessageEmbeds(dispenseEmbed(dispensed))
                .queueAfter(delay, TimeUnit.MILLISECONDS, onDelivered);
    }

    private void updateMachineDropBox(Message machineMessage, DispensedItem dispensed, Message delivered) {
        machineMessage.editMessageEmbeds(machineEmbed(machine(), delivered.getJumpUrl(), dispensed))
                .setComponents(slotButtons(machine()))
                .queue(null, failure -> LOGGER.warn("Could not update vending machine drop-box link.", failure));
    }

    private boolean looksLikeCode(String raw) {
        return SLOT_CODE.matcher(normalizeCode(raw)).matches();
    }

    private String readCode(String raw) {
        String trimmed = raw == null ? "" : raw.trim();
        if (trimmed.startsWith("!")) {
            trimmed = trimmed.substring(1).trim();
        }
        return normalizeCode(trimmed);
    }

    private String normalizeCode(String raw) {
        return raw == null ? "" : raw.trim().toUpperCase(Locale.ROOT);
    }""",
              ),
              (
                  """    private static MessageEmbed machineEmbed(Machine machine) {
        StringBuilder display = new StringBuilder();""",
                  """    private static MessageEmbed machineEmbed(Machine machine) {
        return machineEmbed(machine, "", null);
    }

    private static MessageEmbed machineEmbed(Machine machine, String latestDropUrl, DispensedItem latestDrop) {
        StringBuilder display = new StringBuilder();""",
              ),
              (
                  """        return new EmbedBuilder()
                .setTitle(machine.getTitle())
                .setDescription("```text\n" + display + "```\nUse `/vend code`, press a slot button, or type the code in the configured input channel.")
                .setColor(MACHINE_YELLOW)
                .setFooter(slots.size() + " slots stocked")
                .setTimestamp(Instant.now())
                .build();
    }""",
                  """        display.append("|          DROP-BOX             |\n");
        display.append("|       latest drop below       |\n");
        display.append("+-------------------------------+\n");

        EmbedBuilder embed = new EmbedBuilder()
                .setTitle(machine.getTitle())
                .setDescription("```text\n" + display + "```\nPress a slot button or type `!A1` in the configured input channel.")
                .setColor(MACHINE_YELLOW)
                .setFooter(slots.size() + " slots stocked")
                .setTimestamp(Instant.now());

        if (latestDropUrl != null && !latestDropUrl.isBlank() && latestDrop != null) {
            embed.addField(
                    "Drop-box",
                    "[" + latestDrop.slot().getCode() + " clunked over here](" + latestDropUrl + ")",
                    false
            );
        }
        return embed.build();
    }""",
              ),
          ]

          for old, new in replacements:
              if old not in java:
                  raise SystemExit(f"Could not find Java replacement block starting: {old[:80]!r}")
              java = java.replace(old, new, 1)
          java_path.write_text(java)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              "- Supports the original concept: typing `A1` in a configured input channel.\n- Dispenses into a configured output channel with a tiny anticipation sequence.",
              "- Supports the original concept: typing `A1` or `!A1` in a configured input channel.\n- Dispenses into a configured output channel with a tiny anticipation sequence.\n- Updates the clicked vending machine message with a latest drop-box link after the drop lands.\n- Tries to delete typed input commands so the input channel can feel like a keypad.",
          )
          readme = readme.replace(
              "Stock commands require Manage Server, Administrator, or `OWNER_ID` in `.env`.\n\n## Stock format",
              "Stock commands require Manage Server, Administrator, or `OWNER_ID` in `.env`.\n\nFor the most vending-machine-like flow, create two channels:\n\n- an input/keypad channel where people type `!A1`, or where you pin/post `/machine`\n- a drop-box channel configured with `/stock set-output`, where the actual result appears after a short delay\n\nIf someone presses a button on the machine message, the result still lands in the drop-box channel. The machine message then edits itself with a link to that drop so people can choose when to peek.\n\n## Stock format",
          )
          readme_path.write_text(readme)

          Path(".github/workflows/apply-refinement.yml").unlink()
          PY

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/main/java/org/oaple/vendingmachine/VendingMachineBot.java .github/workflows/apply-refinement.yml
          git commit -m "Refine vending machine interaction flow"
          git push origin HEAD:codex/modern-jda-vending-machine
